<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MacPath 26 — เรียนใช้ macOS 26 (Tahoe) แบบลงมือทำทีละขั้น พร้อมเดสก์ท็อปจำลอง สำหรับผู้ย้ายจาก Windows ตั้งแต่มือใหม่จนโปร" />
    <title>MacPath 26 — เรียนใช้ macOS 26 สำหรับสาย Windows</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a84ff'/%3E%3Cstop offset='1' stop-color='%235e5ce6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 14c-6 0-12 4-12 12 0 9 7 18 12 24 5-6 12-15 12-24 0-8-6-12-12-12z' fill='white' opacity='.95'/%3E%3Cpath d='M32 18v32M22 30h20' stroke='%230a84ff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // ตั้งธีมก่อน render เพื่อไม่ให้แฟลชหน้าขาวในโหมดมืด
      (function () {
        try {
          var t = localStorage.getItem('macpath26:theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
